<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="av-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#av-bg)" />
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3" />

  <!-- AV Monogram Typography Centered Horizontally & Vertically -->
  <g filter="url(#subtle-shadow)">
    <text 
      x="50" 
      y="50" 
      font-family="'Inter', system-ui, -apple-system, sans-serif" 
      font-size="42" 
      font-weight="800" 
      letter-spacing="-1.5"
      fill="#ffffff" 
      text-anchor="middle"
      dominant-baseline="central"
      alignment-baseline="central"
    >AV</text>
  </g>
</svg>
